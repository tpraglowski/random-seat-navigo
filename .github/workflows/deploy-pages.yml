name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        env:
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: |
          mkdir -p dist
          cp index.html script.js styles.css favicon.svg firebase-config.js dist/
          cat > dist/access-config.js <<EOF
          export const ACCESS_CODE = '${ACCESS_CODE}';
          EOF

          # Cache-bust the JS/CSS on every deploy — browsers cache ES module
          # scripts very aggressively, which was leaving some visitors on a
          # stale script.js after an update until they hard-refreshed.
          VER="${GITHUB_SHA::8}"
          sed -i "s/script\.js\"/script.js?v=${VER}\"/" dist/index.html
          sed -i "s/styles\.css\"/styles.css?v=${VER}\"/" dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
